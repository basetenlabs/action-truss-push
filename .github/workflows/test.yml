name: Test Action

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0

      - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  test-model:
    name: Test model push
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0

      - uses: ./
        with:
          truss-directory: ".github/tests/model"
          baseten-api-key: ${{ secrets.BASETEN_API_KEY }}
          cleanup: true
          deploy-timeout-minutes: 45

  test-chain:
    name: Test chain push
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0

      - uses: ./
        with:
          truss-directory: ".github/tests/chain/hello_chain.py"
          baseten-api-key: ${{ secrets.BASETEN_API_KEY }}
          cleanup: true
          predict-payload: '{"max_value": 5}'
          deploy-timeout-minutes: 45
